services:
  db:
    image: postgres:16-alpine
    container_name: bookstore-db
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: ${DB_USER:-bookstore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookstore_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bookstore_user} -d bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookstore-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/bookstore
      DB_USER: ${DB_USER:-bookstore_user}
      DB_PASSWORD: ${DB_PASSWORD:-bookstore_pass}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-256-bits-long-secret-key}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookstore-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend

volumes:
  pgdata:
